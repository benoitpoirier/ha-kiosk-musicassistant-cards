get_track_lyrics:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    uri:
      required: true
      example: "library://track/123"
      selector:
        text:

get_top_picks:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    limit:
      default: 9
      selector:
        number:
          min: 1
          max: 100
          mode: box

get_recommendations:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    username:
      example: "kiosk_alice"
      selector:
        text:
    row_limit:
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    include_hidden:
      default: false
      selector:
        boolean:
    source:
      default: music_assistant
      selector:
        select:
          options:
            - music_assistant
            - similar
            - mixed
    spotify_entity:
      selector:
        entity:
          integration: spotifyplus
          domain: media_player
    refresh:
      default: false
      selector:
        boolean:

get_queue_items:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    queue_id:
      required: true
      example: "media_player.living_room"
      selector:
        text:
    offset:
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box

play_tracks:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    uris:
      required: true
      example: "['library://track/1', 'library://track/2']"
      selector:
        object:
    username:
      selector:
        text:

play_now:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    uri:
      required: true
      example: "spotify://track/5XEHDW9XdDosfI5pltNDq1"
      selector:
        text:
    username:
      selector:
        text:
