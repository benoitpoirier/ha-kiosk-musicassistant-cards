get_track_lyrics:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    uri:
      required: true
      example: "library://track/123"
      selector:
        text:

get_top_picks:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    limit:
      default: 9
      selector:
        number:
          min: 1
          max: 100
          mode: box
