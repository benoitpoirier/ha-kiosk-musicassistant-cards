get_track_lyrics:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    uri:
      required: true
      example: "library://track/123"
      selector:
        text:

get_top_picks:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    limit:
      default: 9
      selector:
        number:
          min: 1
          max: 100
          mode: box

get_recommendations:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: music_assistant
    username:
      example: "kiosk_alice"
      selector:
        text:
    row_limit:
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    include_hidden:
      default: false
      selector:
        boolean:
    source:
      default: music_assistant
      selector:
        select:
          options:
            - music_assistant
            - similar
            - mixed
    spotify_entity:
      selector:
        entity:
          integration: spotifyplus
          domain: media_player
    refresh:
      default: false
      selector:
        boolean:
